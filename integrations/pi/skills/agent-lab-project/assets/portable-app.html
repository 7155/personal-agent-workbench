.turn{margin:0 0 38px}.user-message{display:flex;justify-content:flex-end;margin-bottom:24px}.user-message p{margin:0;background:var(--soft);padding:12px 17px;border-radius:14px;max-width:88%;font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.assistant{min-width:0}.activity{margin-bottom:16px;color:var(--muted);font-size:12px}.activity>summary{display:flex;align-items:center;gap:9px;list-style:none;cursor:pointer;min-height:30px;width:fit-content}.activity>summary::-webkit-details-marker{display:none}.activity .chevron{width:13px;height:13px;transition:transform 160ms var(--ease-out)}.activity[open] .chevron{transform:rotate(90deg)}.activity-icon{width:17px;height:17px;color:var(--accent)}.activity-icon .done-mark,.activity-icon .stop-mark{display:none}.activity[data-running="true"] .activity-icon{animation:activity-turn 1.4s linear infinite}.activity[data-running="false"] .activity-icon .orbit{display:none}.activity[data-running="false"] .activity-icon .done-mark{display:block}.activity[data-state="failed"] .activity-icon,.activity[data-state="cancelled"] .activity-icon{color:var(--muted)}.activity:is([data-state="failed"],[data-state="cancelled"],[data-state="interrupted"],[data-state="unconfirmed"]) .done-mark{display:none}.activity:is([data-state="failed"],[data-state="cancelled"],[data-state="interrupted"],[data-state="unconfirmed"]) .stop-mark{display:block}.elapsed{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}.timeline{list-style:none;padding:8px 0 4px 26px;margin:0;max-width:620px}.timeline li{position:relative;padding:2px 0 13px 14px;border-left:1px solid var(--line);line-height:1.7}.timeline li:last-child{border-left-color:transparent;padding-bottom:3px}.timeline li:before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#85a397;left:-3px;top:9px}.timeline time{font-size:10px;font-variant-numeric:tabular-nums;margin-left:9px;color:var(--muted)}.timeline small{display:block;font-size:11px;overflow-wrap:anywhere;color:var(--muted)}
.source-chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 19px}.source-chip{max-width:240px;display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:11px;text-align:left;min-height:32px}.source-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-number,.citation{font-size:10px;font-variant-numeric:tabular-nums;color:var(--accent)}.citation{padding:1px 5px;background:var(--soft);border-radius:4px;vertical-align:super;line-height:1.2;margin:0 1px}.answer{font-size:15px;line-height:1.9;max-width:72ch;overflow-wrap:anywhere}.answer p{margin:0 0 15px}.answer h2,.answer h3{font-size:16px;font-weight:650;line-height:1.55;margin:26px 0 9px;letter-spacing:0}.answer h2:first-child,.answer h3:first-child{margin-top:0}.answer ul,.answer ol{padding-left:22px;margin:9px 0 18px}.answer li{padding:2px 0}.answer .lead{font-size:17px;line-height:1.85}.answer a,.source a{color:var(--accent);text-underline-offset:3px}.answer code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.86em;background:var(--soft);border-radius:4px;padding:2px 4px}.code-block{margin:17px 0 23px;max-width:100%;background:#f4f7f5;border-radius:10px;overflow:hidden}.code-toolbar{display:flex;justify-content:space-between;align-items:center;padding:7px 13px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}.code-toolbar button{padding:4px 6px;border-radius:5px;font-size:11px}.code-block pre{margin:0;padding:15px;overflow:auto;line-height:1.65}.code-block pre code{padding:0;background:none;font-size:12px;white-space:pre}.answer table{border-collapse:collapse;display:block;max-width:100%;overflow:auto;margin:16px 0;font-size:13px}.answer th,.answer td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);min-width:90px}.answer th{font-weight:600}.answer .empty{color:var(--muted);font-size:13px}.answer .output-note{font-size:11px;color:var(--muted);margin-top:12px}.answer-actions{display:flex;align-items:center;gap:3px;margin-top:18px;color:var(--muted)}.answer-actions .receipt{font-size:10px;margin-left:auto}.answer-note{font-size:12px;margin-top:20px;color:var(--muted);line-height:1.8}.answer-note summary{cursor:pointer;width:fit-content}.answer-note ul{padding-left:18px}.recovery{font-size:12px;line-height:1.75;color:var(--error);margin:12px 0}.error{color:var(--error)}

ne-height:1.7;color:var(--muted);overflow-wrap:anywhere}.history-panel{position:absolute;z-index:3;right:18px;top:64px;width:min(380px,calc(100% - 36px));max-height:65vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.history-head h2{font-size:14px;margin:0}.history-list{display:grid;gap:3px}.history-list>button{text-align:left;padding:11px 9px;border-radius:8px;font-size:12px;line-height:1.6;overflow-wrap:anywhere}.history-list small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.history-list .empty{font-size:12px;color:var(--muted)}

@media(hover:hover) and (pointer:fine){.icon-button:hover,.quiet:hover,.history-list>button:hover,.source-chip:hover{background:var(--soft)}.suggestions button:hover{color:var(--accent)}.send:not(:disabled):hover{background:var(--accent-hover)}}

/* Keep exported results readable and operable on narrow screens. */
.composer-meta,.composer .quiet,.footer-note,.source-detail,.history-list small,.answer-actions .receipt,.source-chip,.code-toolbar{font-size:12px}
.source .address{font-size:11px}.history-list>button,.source p{font-size:13px}
.process-map{display:flex;align-items:center;flex-wrap:wrap;gap:8px 0;list-style:none;margin:0 0 18px;padding:0;color:var(--muted);font-size:12px}
.process-map li{display:flex;align-items:center;gap:7px;line-height:1.6}
.process-map li+li:before{content:'→';margin:0 8px;color:var(--muted)}
.process-map li[data-state="current"]{color:var(--accent);font-weight:600}
.process-map li[data-state="failed"]{color:var(--error)}
.result-steps{list-style:none!important;padding:0!important;counter-reset:result-step}
.result-steps>li{counter-increment:result-step;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;border-bottom:1px solid var(--line);padding:14px 0}
.result-steps>li:before{content:counter(result-step);display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;font-size:12px;color:var(--muted)}
.result-steps strong{font-size:14px}.result-steps p{font-size:13px;margin:5px 0 0}.result-steps small{color:var(--muted);font-size:12px}
.result-metrics{display:grid;gap:16px;margin:16px 0}.result-metric strong{display:block;font-size:13px;margin-bottom:6px}
.result-metric-row{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(68px,auto);align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums;margin-top:5px}
.result-metric-track{height:7px;background:var(--soft)}.result-metric-track span{display:block;height:100%;background:var(--muted)}.result-metric-row[data-series="after"] .result-metric-track span{background:var(--accent)}
@media(max-width:760px){.icon-button,.composer .quiet,.source-chip,.send,.history-list>button,.code-toolbar button{min-height:44px}.send{min-width:44px}.composer textarea{font-size:16px}.footer-note{font-size:11px}.citation{min-width:28px;min-height:28px}.answer-note summary,.source summary{min-height:44px;padding:9px 0}}
</style></head>
<body data-chat-presentation="v1" data-presentation-owner="" data-knowledge="false" data-action="answer" data-context-key="" data-visible="true">
<div class="app">
<header class="topbar"><div class="identity"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v24M4 16h24M7.5 7.5l17 17m0-17-17 17"/><circle cx="16" cy="16" r="8"/></svg><div><h1>资料助手</h1><p>从问题出发，让每一步都有依据。</p></div></div><div class="toolbar"><details class="paw-portable-presentation-menu" id="display-settings" hidden><summary class="icon-button" aria-label="聊天显示设置">显示</summary><div id="agent-presentation"></div></details><button class="icon-button" id="new-chat" type="button" aria-label="开始新对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="button-label">新对话</span></button><button class="icon-button" id="history-toggle" type="button" aria-label="最近记录" aria-expanded="false" aria-controls="history-panel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 .7 7M4 4v6h6M12 8v5l3 2"/></svg><span class="button-label">最近记录</span><span class="sr-only">最近记录</span></button></div></header>
<div class="workspace" id="workspace"><div class="scroll-area" id="scroll-area"><main class="conversation"><section class="welcome" id="welcome"><h2>你想了解什么？</h2><p>带着一个具体问题开始。我们会查找资料、解释步骤，并保留你可以核对的来源。</p><div class="suggestions"><button type="button" data-prompt="请根据已有资料，带我完成第一个入门任务。"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>带我完成第一个入门任务</button><button type="button" data-prompt="我遇到了一个问题，应该提供哪些信息才能继续排查？"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>帮我梳理问题和排查步骤</button></div></section><div id="thread" aria-label="对话记录"></div></main></div><aside class="evidence hidden" id="evidence" aria-label="参考资料"><div class="evidence-head"><h2>参考资料</h2><button class="icon-button" id="close-sources" aria-label="收起参考资料" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><p id="source-detail" class="source-detail"></p><div id="sources"></div></aside></div>
<footer class="composer-wrap"><div id="agent-recovery"></div><form class="composer" id="question-form"><label class="sr-only" for="question">你的问题</label><textarea id="question" rows="2" required maxlength="5000" placeholder="提出问题，或补充你刚才的情况…"></textarea><div class="composer-bottom"><div class="composer-meta"><div id="agent-controls"></div><span class="mode-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a3 3 0 0 1 3 3v12a4 4 0 0 0-4-3H4zM13 8a3 3 0 0 1 3-3h4v12h-3a4 4 0 0 0-4 3"/></svg><span id="mode-label">基于资料回答</span></span><button id="context-button" class="quiet" type="button" disabled>上下文</button><button id="search-button" class="quiet" type="button" hidden>只检索资料</button></div><button id="answer-button" class="send" type="button" aria-label="发送问题"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button><button id="stop-button" class="send stop" type="button" aria-label="停止本次处理" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button></div></form><p class="footer-note" id="footer-note">回答基于已连接资料。关键结论请核对引用来源。</p></footer>
</div><section id="history-panel" class="history-panel hidden" aria-label="最近调用"><div class="history-head"><h2>最近记录</h2><button class="icon-button" id="close-history" type="button" aria-label="关闭最近记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="history-list" class="history-list"></div></section>
<script>
(() => {
 'use strict';
 const $=id=>document.getElementById(id), question=$('question'), scroller=$('scroll-area');
 const knowledgeEnabled=document.body.dataset.knowledge==='true', actionId=document.body.dataset.action||'answer', contextKey=document.body.dataset.contextKey||'';
 let busy=false, active=null, controller=null, clock=null, conversation=[], turnNumber=0, draftRevision=0;
 const callDetailsHandles=new Set();
 function clearCallDetails(){for(const handle of callDetailsHandles)handle.destroy();callDetailsHandles.clear()}
 const presentationOwner=window.pawApp?.identity?.appId||document.body.dataset.presentationOwner;
 $('display-settings').hidden=!presentationOwner||!window.pawAgentUI.presentationVersions;
 $('context-button').hidden=!window.pawAgentUI.mountCallDetails;
 const agentUI=window.pawAgentUI.mount({controls:$('agent-controls'),recovery:$('agent-recovery'),
   ...(presentationOwner?{presentation:{ownerKey:'portable:'+presentationOwner,root:document.body,settings:$('agent-presentation'),defaultVersion:'v2'}}:{}),
   onRetry:()=>{if(active&&!busy){question.value=active.question;run(active.action,active)}},
   onCheck:()=>checkOriginal()});
 const labels={queued:'已收到问题',context_ready:'已读取应用资料',retrieving:'正在检索相关资料',sources_ready:'已找到相关来源',model_starting:'正在准备回答',model_wait:'正在等待响应',thinking:'正在分析问题',answering:'正在整理回答',completed:'回答已完成',failed:'本次未完成',cancelled:'本次输出已停止',interrupted:'连接中断，原请求已保留',unconfirmed:'正在等待结果确认'};
 const icon='<svg viewBox="0 0 24 24" class="activity-icon" aria-hidden="true"><g class="orbit"><path d="M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 1-9-9"/><path d="M7 5 5 7m12 10 2 2"/></g><path class="done-mark" d="m5 12 4 4L19 6"/><path class="stop-mark" d="m7 7 10 10M17 7 7 17"/></svg>';
 $('search-button').hidden=!knowledgeEnabled;
 function text(el,value){el.textContent=String(value??'')}
 function element(tag,className,value){const el=document.createElement(tag);if(className)el.className=className;if(value!==undefined)text(el,value);return el}
 function atBottom(){return scroller.scrollHeight-scroller.scrollTop-scroller.clientHeight<110}
 function keepBottom(follow){if(follow)scroller.scrollTop=scroller.scrollHeight}
 function safeURL(raw){try{const url=new URL(raw);return ['https:','http:'].includes(url.protocol)?url.href:null}catch{return null}}
 let sourceFocus=null;
 function openSources(turn,sourceId){
   sourceFocus=document.activeElement;$('display-settings').open=false;
   $('workspace').classList.add('evidence-open');$('evidence').classList.remove('hidden');renderSourcePanel(turn);updateEvidenceDialog();$('close-sources').focus();
   if(sourceId){const detail=[...$('sources').querySelectorAll('details')].find(el=>el.dataset.sourceId===sourceId);if(detail){detail.open=true;detail.scrollIntoView?.({block:'nearest'})}}
 }
 function updateEvidenceDialog(){
   const modal=!$('evidence').classList.contains('hidden')&&document.body.dataset.chatPresentation==='v2'&&window.matchMedia?.('(max-width:960px)')?.matches;
   if(modal){$('evidence').setAttribute('role','dialog');$('evidence').setAttribute('aria-modal','true')}
   else{$('evidence').removeAttribute('role');$('evidence').removeAttribute('aria-modal')}
 }
 window.addEventListener('resize',updateEvidenceDialog);
 new MutationObserver(updateEvidenceDialog).observe(document.body,{attributes:true,attributeFilter:['data-chat-presentation']});
 function inline(el,value,turn){
   const pattern=/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\(https?:\/\/[^\s)]+\)|\[\d+\])/g;let start=0;
   for(const match of value.matchAll(pattern)){
     el.append(document.createTextNode(value.slice(start,match.index)));const token=match[0];
     if(token.startsWith('**'))el.append(element('strong','',token.slice(2,-2)));
     else if(token.startsWith('`'))el.append(element('code','',token.slice(1,-1)));
     else if(/^\[\d+\]$/.test(token)){
       const index=Number(token.slice(1,-1))-1, source=turn.sources[index];
       if(source){const button=element('button','citation',index+1);button.type='button';button.setAttribute('aria-label',`查看来源 ${index+1}：${sourceTitle(source)}`);button.onclick=()=>openSources(turn,source.sourceId);el.append(button)}else el.append(document.createTextNode(token));
     }else{
       const parts=token.match(/^\[([^\]]+)\]\((.*)\)$/),url=safeURL(parts[2]);const a=element(url?'a':'span','',parts[1]);if(url){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}el.append(a);
     }
     start=match.index+token.length;
   }
   el.append(document.createTextNode(value.slice(start)));
 }

       else{renderAnswer(turn,row.progress?.text||'原调用尚未完成，请先核对记录。',true);stage(turn,{...row.progress,stage:row.state,text:undefined});turn.activity.dataset.running='false';turn.values=row.input;turn.requestId=row.requestId;agentUI.failure({state:row.state,message:row.message})}
       question.value=q;turn.elapsed.classList.add('hidden');refreshSubmissionControls();hideHistory();question.focus();keepBottom(true);
     };$('history-list').append(button)}
   }catch(error){text($('history-list'),error.message||'记录暂时不可读，请稍后重试。')}
 };
 document.addEventListener('keydown',event=>{
   if(event.key!=='Tab'||$('evidence').getAttribute('aria-modal')!=='true')return;
   const items=[...$('evidence').querySelectorAll('button:not([disabled]),a[href],summary,[tabindex="0"]')].filter(item=>item.getClientRects().length);
   const first=items[0]||$('close-sources'),last=items.at(-1)||first;
   if(event.shiftKey&&(document.activeElement===first||!$('evidence').contains(document.activeElement))){event.preventDefault();last.focus()}
   else if(!event.shiftKey&&(document.activeElement===last||!$('evidence').contains(document.activeElement))){event.preventDefault();first.focus()}
 });
 document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('history-panel').classList.contains('hidden'))hideHistory();else if(!$('evidence').classList.contains('hidden'))$('close-sources').click()}});
 document.addEventListener('visibilitychange',()=>document.body.dataset.visible=String(!document.hidden));
 window.pawApp?.ready?.();
