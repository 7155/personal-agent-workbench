name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python, schemas, and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # Product provenance verifies that its evidence commit is an
          # ancestor of HEAD; a depth-1 checkout cannot answer that safely.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sync locked Python dependencies
        run: |
          python -m pip install "uv==0.11.1"
          uv sync --locked --python python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Compile Python
        run: python -m compileall -q rag_ime scripts tests
      - name: Check package boundaries
        run: python scripts/check_import_boundaries.py
      - name: Check Agent Lab and data owner boundaries
        run: python scripts/check_owner_boundaries.py
      - name: Check route ownership
        run: python scripts/check_route_ownership.py
      - name: Lint correctness rules
        # Narrow correctness-only rule set pinned in pyproject; see the comment
        # there for the rules deliberately not enabled yet.
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.14.2"
          args: "check rag_ime scripts tests"
      - name: Type-check stable boundary contracts
        # Scope and strictness live in [tool.mypy] in pyproject.toml: only the
        # stable contract modules are checked, strictly, and they are clean.
        run: uvx --from "mypy==2.3.0" mypy
      - name: Validate product status
        run: python scripts/check_product_status.py --json
      - name: Audit public MiniMind completion contract
        run: python scripts/minimind_retraining.py audit
      - name: Enforce public source repository hygiene
        # A source repository may be public before a signed/notarized macOS
        # package exists. Secret shapes, machine paths, generated artifacts,
        # missing notices, and dirty state must still fail CI.
        run: python scripts/check_public_release.py --repository-only
      - name: Run unit suite
        env:
          PYTHONWARNINGS: "error::ResourceWarning"
        run: python -m unittest discover -s tests
      - name: Check shell syntax
        run: |
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

  web-architecture:
    name: Web contracts (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [ownership, conversation]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install locked Web dependencies
        run: |
          corepack enable && corepack prepare pnpm@11.9.0 --activate
          pnpm --dir control-center-web install --frozen-lockfile
      - name: Type-check Web contracts
        if: matrix.suite == 'ownership'
        run: pnpm --dir control-center-web typecheck
      - name: Check host registration and existing Lab delivery
        if: matrix.suite == 'ownership'
        run: >-
          pnpm --dir control-center-web exec vitest run
          src/paw-os/extensions/host-registry.test.ts
          src/paw-os/extensions/registry-hosts.test.ts
          src/features/eval-lab/projects/LabAppDelivery.test.tsx
          --maxWorkers=1 --testTimeout=60000
      - name: Check shared chat ownership
        if: matrix.suite == 'ownership'
        run: >-
          pnpm --dir control-center-web exec vitest run
          src/features/agent/state/live-store.test.ts
          src/features/agent/state/live-store.transport.test.ts
          src/features/agent/state/live-store.acknowledgement.test.ts
          src/features/agent/runtime
          src/features/conversation-ui/conversation-preload.test.ts
          src/app/preview-control-transport.test.ts
          --pool=threads --maxWorkers=1 --testTimeout=60000
      - name: Check conversation interaction and vertical App compatibility
        if: matrix.suite == 'conversation'
        # Synthetic protocol/UI regressions. Native foreground and live Provider
        # acceptance remain separate from these tests.
        run: >-
          pnpm --dir control-center-web exec vitest run
          src/features/agent/composer/AgentComposer.test.tsx
          src/features/agent/workspace/AgentFilesPanel.test.tsx
          src/features/composer/ComposerInteraction.test.tsx
          src/paw-os/apps/PawSessionWorkspace.test.tsx
          src/paw-os/apps/PawSessionWorkspace.performance.test.tsx
          src/paw-os/apps/PawSessionWorkspace.input-ownership.test.tsx
          src/paw-os/apps/PawAgentApp.test.tsx
          src/paw-os/apps/PawPrimaryAssistantHome.test.tsx
          src/paw-os/apps/PawPrimaryDirectoryPicker.test.tsx
          src/paw-os/apps/PawPrimaryAssistantFlow.test.tsx
          src/paw-os/extensions/ChatSurface.test.tsx
          extension-apps/earth-research/App.test.tsx
          extension-apps/earth-research/App.layout.test.tsx
          extension-apps/zhanggui-wenshu/App.test.tsx
          --pool=threads --maxWorkers=1 --testTimeout=60000
      - name: Check scoped catalog refresh and plugin lifecycle
        if: matrix.suite == 'ownership'
        run: >-
          pnpm --dir control-center-web exec vitest run
          src/features/plugins
          src/paw-os/extensions/installation.test.tsx
          src/paw-os/apps/PawSystemApps.test.tsx
          --pool=threads --maxWorkers=1 --testTimeout=60000
      - name: Check desktop companion state and cleanup
        if: matrix.suite == 'ownership'
        run: |
          pnpm --dir control-center-web test:electron
          pnpm --dir control-center-web exec vitest run \
            src/features/agent/desktop-pet-interaction.test.ts \
            src/features/agent/desktop-pet-snapshot.test.ts \
            src/features/agent/desktop-pet-publisher.test.ts \
            src/features/agent/desktop-pet-surface.test.tsx \
            src/paw-os/shell/desktop-pet-directory-projection.test.ts \
            src/paw-os/shell/PawDesktopPetPublisher.test.tsx \
            src/paw-os/shell/PawWorkDirectory.test.tsx \
            src/app/standalone-surface.test.ts \
            --pool=threads --maxWorkers=1 --testTimeout=60000

  macos:
    name: Native control and Squirrel release
    # The pinned Squirrel source uses typed throws, which requires the Swift 6
    # compiler shipped with Xcode 16 rather than macOS 14's Xcode 15.4.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sync locked Python dependencies
        run: |
          python -m pip install "uv==0.11.1"
          uv sync --locked --python python
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enable pinned pnpm for the Web control build
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Run full macOS unit suite
        env:
          PYTHONWARNINGS: "error::ResourceWarning"
        run: python -m unittest discover -s tests
      - name: Build native control center
        run: scripts/build_control_center.sh
      - name: Build headless voice agent
        run: scripts/build_voice_input.sh
      - name: Prepare pinned Squirrel source
        env:
          RAG_IME_SQUIRREL_WORKDIR: ${{ runner.temp }}/rag-ime-squirrel
        run: scripts/prepare_squirrel_workspace.sh
      - name: Build patched Squirrel Release
        env:
          RAG_IME_SQUIRREL_WORKDIR: ${{ runner.temp }}/rag-ime-squirrel
          RAG_IME_SQUIRREL_DERIVED_DATA: ${{ runner.temp }}/rag-ime-squirrel-derived-data
          RAG_IME_SQUIRREL_PREINSTALL: auto
          RAG_IME_SQUIRREL_SKIP_CODESIGN: "1"
        run: scripts/build_patched_squirrel.sh build
      - name: Verify native signatures
        run: |
          codesign --verify --deep --strict build/RagImeControlElectron.app
          codesign --verify --deep --strict build/RagImeVoice.app
