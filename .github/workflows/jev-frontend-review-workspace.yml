name: Jev isolated frontend review workspace
on:
  push:
    branches: [codex/jev-frontend-review-20260928]
    paths: [.github/workflows/jev-frontend-review-workspace.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  frontend-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ee530bea05f54a199544153594b50e0a00c8bfa
          persist-credentials: false
      - name: Apply hash-verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          def blob(sha):
              data=json.loads(subprocess.check_output(['gh','api','repos/7155/personal-agent-workbench/git/blobs/'+sha]))
              return base64.b64decode(data['content'])
          def apply(data, expected):
              patch=lzma.decompress(data)
              assert hashlib.sha256(patch).hexdigest()==expected
              p=pathlib.Path('/tmp/review.patch');p.write_bytes(patch)
              subprocess.run(['git','apply','--check','--unidiff-zero',str(p)],check=True)
              subprocess.run(['git','apply','--index','--unidiff-zero',str(p)],check=True)
          apply(b''.join(blob(s) for s in ['5ab9883fe8a67d91f552743ce238ffde591f3192','d235a25afbb603b11f42c8df1d60ccb6694e439f','cc7486a05d0dddb6843be161825372789d0fb079','b3918298a47f3c931fd137ae6168507079f792df']), '803106dd2240de5f54fed4330b7d60cc6bc1be29a7898ba8d5097a8763865883')
          for sha,digest in [
              ('db2aee39981aeaa87f9bee294a1a40c41fa41789','6f83912310cc2cc5066133c395ba95b44e046a66a8606370483979f2684146d9'),
              ('7fb1794480d6aa4d2a6c89a8582368e8a2f89da5','0bd1ca967005fd714e3805d796503b75c3bd1d0c8ff8e7954075f4b05f69e6fc'),
              ('aaf21d3916886dc131398e8afb68568a0c449e2a','f94dac22a82dfe322fe3df6a563ac4275b7abc97aea3e01675c1b47226aab303'),
              ('f0b99f468fe02256bf1f4af0f25995172425186d','88dab3ece4181efe7f9213237ec0587d8f9fb0802797d60501ca6bb11d5196cf')]:
              apply(blob(sha),digest)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='a4621227bdfe1298e1b1ea47d6b2cba663dc6f33',tree
          p=pathlib.Path('control-center-web/review-output');p.mkdir(exist_ok=True)
          p.joinpath('candidate-tree.txt').write_text(tree+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install pinned frontend and Chromium
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --dir control-center-web install --frozen-lockfile
          pnpm --dir control-center-web exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser checks
        id: browser
        continue-on-error: true
        working-directory: control-center-web
        run: |
          pnpm exec vite --host 127.0.0.1 --port 5199 --strictPort >review-output/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5199/ >/dev/null && break; sleep 1; done
          node e2e/verify-workbench-polish.mjs 2>&1 | tee review-output/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-polish-browser-a4621227
          path: control-center-web/review-output
          retention-days: 3
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        working-directory: control-center-web
        run: pnpm typecheck 2>&1 | tee review-output/typecheck.log
      - name: Affected regression tests
        id: tests
        continue-on-error: true
        working-directory: control-center-web
        run: |
          pnpm exec vitest run --maxWorkers=2 --testTimeout=60000 src/features/composer src/features/agent/composer src/features/rooms/composer src/features/semantic-workspace src/paw-os/apps/PawJevTeamPanels.test.tsx src/paw-os/apps/PawRoomWorkspace.test.tsx src/paw-os/apps/PawRoomConversation.test.tsx src/paw-os/apps/PawSessionWorkspace.test.tsx src/paw-os/apps/PawSessionWorkspace.performance.test.tsx src/paw-os/apps/session-mission.test.ts src/features/conversation-ui src/features/agent/timeline/code-highlighting.test.tsx 2>&1 | tee review-output/tests.log
      - name: Build
        id: build
        continue-on-error: true
        working-directory: control-center-web
        run: pnpm build 2>&1 | tee review-output/build.log
      - name: Record outcomes
        if: always()
        env:
          BROWSER: ${{ steps.browser.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          p=pathlib.Path('control-center-web/review-output');p.mkdir(exist_ok=True)
          p.joinpath('outcomes.json').write_text(json.dumps({k:os.environ[k] for k in ['BROWSER','TYPECHECK','TESTS','BUILD']},indent=2))
          PY
      - name: Store verified source tree without changing any branch
        if: steps.browser.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json,pathlib,subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert paths and all(p.startswith('control-center-web/') for p in paths)
          entries=[{'path':p,'type':'blob','mode':'100644','content':pathlib.Path(p).read_text()} for p in paths]
          data={'base_tree':'5a4dab85bfd7177af1059794b0268a7999bb1a27','tree':entries}
          result=json.loads(subprocess.check_output(['gh','api','repos/7155/personal-agent-workbench/git/trees','--method','POST','--input','-'],input=json.dumps(data).encode()))
          assert result['sha']=='a4621227bdfe1298e1b1ea47d6b2cba663dc6f33',result['sha']
          pathlib.Path('control-center-web/review-output/verified-github-tree.json').write_text(json.dumps({'sha':result['sha'],'paths':paths},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-polish-checks-a4621227
          path: control-center-web/review-output
          retention-days: 3
      - name: Require all checks
        if: always()
        run: test '${{ steps.browser.outcome }}' = success && test '${{ steps.typecheck.outcome }}' = success && test '${{ steps.tests.outcome }}' = success && test '${{ steps.build.outcome }}' = success
