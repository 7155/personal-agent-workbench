name: Jev isolated frontend review workspace

on:
  push:
    branches: [codex/jev-frontend-review-20260928]
    paths: [.github/workflows/jev-frontend-review-workspace.yml]

permissions:
  contents: read

jobs:
  baseline-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ee530bea05f54a199544153594b50e0a00c8bfa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install pinned dependencies and Chromium
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm --dir control-center-web install --frozen-lockfile
          pnpm --dir control-center-web exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture before screenshots using real product components
        working-directory: control-center-web
        run: |
          mkdir -p review-output
          pnpm exec vite --host 127.0.0.1 --port 5199 --strictPort >review-output/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5199/ >/dev/null && break; sleep 1; done
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1440, height: 960 }, locale: 'zh-CN' });
          const errors = [];
          page.on('pageerror', error => errors.push(String(error)));
          for (const width of [1440, 820]) {
            await page.setViewportSize({ width, height: 960 });
            for (const scene of ['parallel', 'approval']) {
              await page.goto(`http://127.0.0.1:5199/e2e/fixtures/jev-execution.html?scene=${scene}`, { waitUntil: 'networkidle' });
              await page.locator('.jev-mission').waitFor({ timeout: 30000 });
              await page.screenshot({ path: `review-output/before-jev-${scene}-${width}-light.png`, animations: 'disabled' });
              await page.getByRole('button', { name: '深色主题', exact: true }).click();
              await page.screenshot({ path: `review-output/before-jev-${scene}-${width}-dark.png`, animations: 'disabled' });
            }
          }
          await page.setViewportSize({ width: 1440, height: 960 });
          await page.goto('http://127.0.0.1:5199/?frontend=paw-os&controlTransport=mock#/agent?session=session-preview', { waitUntil: 'networkidle' });
          await page.locator('.paw-session-workspace').waitFor({ timeout: 30000 });
          await page.locator('.paw-session-workspace__runtime').filter({ hasText: '已同步' }).waitFor({ timeout: 30000 });
          await page.screenshot({ path: 'review-output/before-session-1440-light.png', animations: 'disabled' });
          await writeFile('review-output/session-before-text.txt', await page.locator('.paw-session-workspace').innerText());
          await writeFile('review-output/browser-errors.json', JSON.stringify(errors, null, 2));
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-before-browser-3ee530be
          path: control-center-web/review-output
          retention-days: 3
